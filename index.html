<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiempo Afuera</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .subtitle {
      margin: 0 0 22px;
      color: #6b7280;
    }
    .clock {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }
    input[type="time"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 1rem;
      background: white;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: .98rem;
      font-weight: 700;
    }
    .primary {
      background: #111827;
      color: white;
    }
    .primary:hover { opacity: .9; }
    .result {
      margin-top: 18px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 14px;
      display: none;
    }
    .result strong {
      font-size: 1.3rem;
    }
    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .list-head h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .clear {
      background: #eef2f7;
      color: #374151;
      padding: 9px 12px;
    }
    .entries {
      display: grid;
      gap: 10px;
    }
    .entry {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: #f9fafb;
      border-radius: 14px;
    }
    .entry-time {
      font-weight: 700;
    }
    .elapsed {
      color: #4b5563;
      font-weight: 600;
      text-align: right;
    }
    .remove {
      background: transparent;
      color: #9ca3af;
      padding: 6px 8px;
      font-size: 1.1rem;
    }
    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 16px 0 4px;
    }
    .note {
      font-size: .85rem;
      color: #9ca3af;
      margin-top: 14px;
    }
    @media (max-width: 560px) {
      .input-row {
        grid-template-columns: 1fr;
      }
      .entry {
        grid-template-columns: 1fr auto;
      }
      .elapsed {
        grid-column: 1 / 2;
        grid-row: 2;
        text-align: left;
      }
      .remove {
        grid-column: 2;
        grid-row: 1 / span 2;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>⏱️ Tiempo Afuera</h1>
      <p class="subtitle">Ingresa la hora de llegada y calcula automáticamente cuánto tiempo llevan afuera.</p>
      <div class="clock" id="clock">Hora actual: --:--</div>

      <div class="input-row">
        <input id="arrivalTime" type="time" step="60" />
        <button class="primary" id="calculateBtn">Calcular y agregar</button>
      </div>

      <div class="result" id="result"></div>
      <div class="note">La app usa la hora actual de Vancouver (America/Vancouver).</div>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>Registros activos</h2>
        <button class="clear" id="clearBtn">Limpiar todo</button>
      </div>
      <div class="entries" id="entries"></div>
    </section>
  </main>

  <script>
    const TIME_ZONE = "America/Vancouver";
    const arrivalInput = document.getElementById("arrivalTime");
    const calculateBtn = document.getElementById("calculateBtn");
    const result = document.getElementById("result");
    const entriesEl = document.getElementById("entries");
    const clockEl = document.getElementById("clock");
    const clearBtn = document.getElementById("clearBtn");

    let entries = JSON.parse(localStorage.getItem("timeOutsideEntries") || "[]");

    function getVancouverParts() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIME_ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(new Date());

      const map = {};
      parts.forEach(p => { if (p.type !== "literal") map[p.type] = p.value; });

      return {
        year: Number(map.year),
        month: Number(map.month),
        day: Number(map.day),
        hour: Number(map.hour),
        minute: Number(map.minute),
        second: Number(map.second)
      };
    }

    function currentMinutes() {
      const p = getVancouverParts();
      return p.hour * 60 + p.minute + p.second / 60;
    }

    function formatClock() {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: TIME_ZONE,
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(new Date());
    }

    function format12Hour(hhmm) {
      const [h, m] = hhmm.split(":").map(Number);
      const period = h >= 12 ? "PM" : "AM";
      const hour = ((h + 11) % 12) + 1;
      return `${hour}:${String(m).padStart(2,"0")} ${period}`;
    }

    function elapsedText(hhmm) {
      const [h, m] = hhmm.split(":").map(Number);
      const start = h * 60 + m;
      let diff = Math.floor(currentMinutes() - start);

      // Assume the supplied time is from today; if it is later than now,
      // treat it as AM/PM ambiguity only when a 12-hour interpretation makes sense.
      if (diff < 0) {
        if (h < 12) {
          const altStart = (h + 12) * 60 + m;
          diff = Math.floor(currentMinutes() - altStart);
        }
      }

      if (diff < 0) return "Hora futura";

      const hours = Math.floor(diff / 60);
      const minutes = diff % 60;

      if (hours === 0) return `${minutes} minuto${minutes === 1 ? "" : "s"}`;
      if (minutes === 0) return `${hours} hora${hours === 1 ? "" : "s"}`;
      return `${hours} hora${hours === 1 ? "" : "s"} con ${minutes} minuto${minutes === 1 ? "" : "s"}`;
    }

    function save() {
      localStorage.setItem("timeOutsideEntries", JSON.stringify(entries));
    }

    function renderEntries() {
      if (!entries.length) {
        entriesEl.innerHTML = '<div class="empty">No hay registros activos.</div>';
        return;
      }

      entriesEl.innerHTML = "";
      entries.forEach(entry => {
        const row = document.createElement("div");
        row.className = "entry";

        const arrival = document.createElement("div");
        arrival.className = "entry-time";
        arrival.textContent = `Llegada: ${format12Hour(entry.time)}`;

        const elapsed = document.createElement("div");
        elapsed.className = "elapsed";
        elapsed.textContent = elapsedText(entry.time);

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "✕";
        remove.title = "Eliminar";
        remove.onclick = () => {
          entries = entries.filter(x => x.id !== entry.id);
          save();
          renderEntries();
        };

        row.append(arrival, elapsed, remove);
        entriesEl.appendChild(row);
      });
    }

    function addEntry() {
      const time = arrivalInput.value;
      if (!time) {
        result.style.display = "block";
        result.textContent = "Selecciona una hora de llegada.";
        return;
      }

      const elapsed = elapsedText(time);

      result.style.display = "block";
      result.innerHTML = `Desde las <strong>${format12Hour(time)}</strong> hasta ahora: <strong>${elapsed}</strong>.`;

      entries.unshift({
        id: Date.now(),
        time
      });

      save();
      renderEntries();
      arrivalInput.value = "";
    }

    calculateBtn.addEventListener("click", addEntry);
    arrivalInput.addEventListener("keydown", e => {
      if (e.key === "Enter") addEntry();
    });

    clearBtn.addEventListener("click", () => {
      entries = [];
      save();
      renderEntries();
      result.style.display = "none";
    });

    function tick() {
      clockEl.textContent = `Hora actual: ${formatClock()}`;
      renderEntries();
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
