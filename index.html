<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freedom Bikes | Time Outside</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #edf3f8 0%, #f7f9fb 50%, #eef2f6 100%);
    color: #10213b;
    min-height: 100vh;
}

/* HEADER */

.header {
    text-align: center;
    padding: 18px 20px 14px;
}

.logo {
    width: min(430px, 80%);
    height: auto;
    display: block;
    margin: 0 auto;
}

.tagline {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 700;
    color: #40516b;
}

/* MAIN */

.container {
    width: min(820px, 94%);
    margin: auto;
    padding-bottom: 30px;
}

/* CARDS */

.card {
    background: rgba(255, 255, 255, 0.97);
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 18px;
    border: 1px solid rgba(220, 228, 236, 0.9);
    box-shadow: 0 8px 25px rgba(25, 45, 70, 0.08);
}

/* TITLE */

.title-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.title-icon {
    font-size: 34px;
}

h1 {
    margin: 0;
    font-size: 30px;
    color: #10213b;
}

.subtitle {
    margin: 5px 0 20px 46px;
    font-size: 15px;
    color: #52647c;
}

/* CURRENT TIME */

.time-box {
    background: #f2f5f8;
    border-radius: 14px;
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.time-left {
    display: flex;
    align-items: center;
    gap: 11px;
}

.clock-icon {
    font-size: 25px;
}

.time-label {
    font-size: 13px;
    color: #52647c;
}

.current-time {
    font-size: 23px;
    font-weight: 800;
    margin-top: 2px;
}

.date {
    font-size: 13px;
    color: #263c5a;
}

/* INPUT */

.input-row {
    display: grid;
    grid-template-columns: 1fr 160px;
    gap: 12px;
}

.time-input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #d4dde7;
    border-radius: 12px;
    font-size: 17px;
    color: #10213b;
    outline: none;
}

.time-input:focus {
    border-color: #10213b;
    box-shadow: 0 0 0 3px rgba(16, 33, 59, 0.06);
}

.calculate {
    border: none;
    border-radius: 12px;
    background: #10213b;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.calculate:hover {
    opacity: 0.93;
}

.hint {
    margin-top: 11px;
    color: #64748b;
    font-size: 13px;
}

/* RESULT */

.result {
    display: none;
    margin-top: 18px;
    padding: 18px 20px;
    border-radius: 14px;
    background: #eaf8ef;
    border: 1px solid #c8ead5;
    color: #075d32;
}

.result-label {
    font-size: 14px;
}

.result-time {
    margin-top: 3px;
    font-size: 25px;
    font-weight: 800;
}

/* ACTIVE RENTALS */

.records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 16px;
}

.records-title {
    display: flex;
    align-items: center;
    gap: 11px;
}

.records-icon {
    font-size: 27px;
}

.records-title h2 {
    margin: 0;
    font-size: 23px;
}

.records-description {
    color: #617189;
    margin-top: 3px;
    font-size: 13px;
}

.clear-button {
    border: none;
    padding: 10px 13px;
    border-radius: 10px;
    background: #edf1f5;
    color: #263c5a;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

/* ENTRY */

.entries {
    display: grid;
    gap: 9px;
}

.entry {
    background: #f5f7f9;
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 15px;
    align-items: center;
}

.arrival {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
}

.arrival-icon {
    font-size: 21px;
}

.arrival strong {
    font-size: 16px;
}

.elapsed {
    font-size: 15px;
    font-weight: 800;
}

.delete {
    border: none;
    width: 31px;
    height: 31px;
    border-radius: 8px;
    background: #e8edf2;
    color: #53657c;
    font-size: 17px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 18px;
    color: #8290a2;
    font-size: 14px;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #8190a3;
    font-size: 11px;
    padding: 4px 20px 25px;
}

/* MOBILE */

@media (max-width: 650px) {

    .header {
        padding: 15px 15px 12px;
    }

    .logo {
        width: 85%;
    }

    .tagline {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .container {
        width: 94%;
    }

    .card {
        padding: 19px 17px;
        border-radius: 16px;
    }

    h1 {
        font-size: 25px;
    }

    .title-icon {
        font-size: 29px;
    }

    .subtitle {
        margin-left: 0;
        font-size: 14px;
        margin-bottom: 17px;
    }

    .time-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 9px;
    }

    .current-time {
        font-size: 21px;
    }

    .input-row {
        grid-template-columns: 1fr;
    }

    .calculate {
        padding: 14px;
    }

    .records-header {
        align-items: flex-start;
    }

    .records-title h2 {
        font-size: 20px;
    }

    .records-description {
        display: none;
    }

    .clear-button {
        white-space: nowrap;
    }

    .entry {
        grid-template-columns: 1fr auto;
    }

    .elapsed {
        grid-column: 1;
        padding-left: 30px;
        font-size: 14px;
    }

    .delete {
        grid-column: 2;
        grid-row: 1 / span 2;
    }
}
</style>
</head>

<body>

<header class="header">

    <img
        src="FB.png"
        alt="Freedom Bikes Rentals"
        class="logo"
    >

    <div class="tagline">
        RIDE • EXPLORE • BE FREE
    </div>

</header>

<main class="container">

<section class="card">

    <div class="title-row">
        <div class="title-icon">⏱️</div>
        <h1>Time Outside</h1>
    </div>

    <div class="subtitle">
        Enter the departure time to see how long the bike has been out.
    </div>

    <div class="time-box">

        <div class="time-left">

            <div class="clock-icon">🕒</div>

            <div>
                <div class="time-label">
                    Current Time (Vancouver)
                </div>

                <div
                    class="current-time"
                    id="clock"
                >
                    --
                </div>
            </div>

        </div>

        <div class="date" id="date"></div>

    </div>

    <div class="input-row">

        <input
            id="arrivalTime"
            class="time-input"
            type="text"
            inputmode="decimal"
            placeholder="Example: 5:48"
            autocomplete="off"
        >

        <button
            id="calculateBtn"
            class="calculate"
        >
            Calculate
        </button>

    </div>

    <div class="hint">
        ⓘ Simply enter the time, for example: 5:48, 6:10 or 4:35.
    </div>

    <div id="result" class="result">

        <div class="result-label">
            Time outside:
        </div>

        <div
            id="resultTime"
            class="result-time"
        ></div>

    </div>

</section>


<section class="card">

    <div class="records-header">

        <div class="records-title">

            <div class="records-icon">☷</div>

            <div>
                <h2>Active Rentals</h2>

                <div class="records-description">
                    Times update automatically.
                </div>
            </div>

        </div>

        <button
            id="clearBtn"
            class="clear-button"
        >
            🗑 Clear All
        </button>

    </div>

    <div id="entries" class="entries"></div>

</section>

</main>

<footer class="footer">
    Freedom Bikes Rentals • Vancouver
</footer>


<script>

const TIME_ZONE = "America/Vancouver";

const input = document.getElementById("arrivalTime");
const calculateButton = document.getElementById("calculateBtn");
const result = document.getElementById("result");
const resultTime = document.getElementById("resultTime");
const entriesContainer = document.getElementById("entries");
const clearButton = document.getElementById("clearBtn");
const clock = document.getElementById("clock");
const dateElement = document.getElementById("date");

let entries =
    JSON.parse(
        localStorage.getItem("freedomBikeTimes") || "[]"
    );


function currentVancouverTime() {

    const parts =
        new Intl.DateTimeFormat("en-CA", {
            timeZone: TIME_ZONE,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).formatToParts(new Date());

    const values = {};

    parts.forEach(part => {
        if (part.type !== "literal") {
            values[part.type] = Number(part.value);
        }
    });

    return {
        hour: values.hour,
        minute: values.minute,
        second: values.second
    };
}


function updateClock() {

    clock.textContent =
        new Intl.DateTimeFormat("en-US", {
            timeZone: TIME_ZONE,
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }).format(new Date());

    dateElement.textContent =
        "📅 " +
        new Intl.DateTimeFormat("en-CA", {
            timeZone: TIME_ZONE,
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }).format(new Date());
}


function parseTime(value) {

    value =
        value
        .trim()
        .replace(";", ":")
        .replace(".", ":");

    if (!value.includes(":")) {

        if (value.length === 3) {
            value =
                value.slice(0, 1) +
                ":" +
                value.slice(1);
        }

        else if (value.length === 4) {
            value =
                value.slice(0, 2) +
                ":" +
                value.slice(2);
        }
    }

    const pieces = value.split(":");

    if (pieces.length !== 2) {
        return null;
    }

    const hour = Number(pieces[0]);
    const minute = Number(pieces[1]);

    if (
        !Number.isInteger(hour) ||
        !Number.isInteger(minute) ||
        hour < 1 ||
        hour > 12 ||
        minute < 0 ||
        minute > 59
    ) {
        return null;
    }

    return {
        hour,
        minute,
        display:
            hour +
            ":" +
            String(minute).padStart(2, "0")
    };
}


function calculateElapsed(time) {

    const now = currentVancouverTime();

    const nowMinutes =
        now.hour * 60 +
        now.minute;

    let am;
    let pm;

    if (time.hour === 12) {
        am = time.minute;
        pm = 720 + time.minute;
    }

    else {
        am =
            time.hour * 60 +
            time.minute;

        pm =
            (time.hour + 12) * 60 +
            time.minute;
    }

    const possible =
        [am, pm].filter(
            value => value <= nowMinutes
        );

    if (!possible.length) {
        return null;
    }

    const arrival =
        Math.max(...possible);

    return nowMinutes - arrival;
}


function durationText(minutes) {

    const hours =
        Math.floor(minutes / 60);

    const mins =
        minutes % 60;

    if (hours === 0) {

        return (
            mins +
            " minute" +
            (mins === 1 ? "" : "s")
        );
    }

    if (mins === 0) {

        return (
            hours +
            " hour" +
            (hours === 1 ? "" : "s")
        );
    }

    return (
        hours +
        " hour" +
        (hours === 1 ? "" : "s") +
        " " +
        mins +
        " minute" +
        (mins === 1 ? "" : "s")
    );
}


function save() {

    localStorage.setItem(
        "freedomBikeTimes",
        JSON.stringify(entries)
    );
}


function render() {

    entriesContainer.innerHTML = "";

    if (entries.length === 0) {

        entriesContainer.innerHTML =
            '<div class="empty">No active rentals.</div>';

        return;
    }

    entries.forEach(entry => {

        const parsed =
            parseTime(entry.time);

        if (!parsed) return;

        const elapsed =
            calculateElapsed(parsed);

        const row =
            document.createElement("div");

        row.className = "entry";

        const arrival =
            document.createElement("div");

        arrival.className = "arrival";

        arrival.innerHTML =
            '<span class="arrival-icon">◷</span>' +
            '<span>Departure: <strong>' +
            entry.time +
            "</strong></span>";

        const elapsedElement =
            document.createElement("div");

        elapsedElement.className =
            "elapsed";

        elapsedElement.textContent =
            elapsed === null
            ? "Invalid time"
            : durationText(elapsed);

        const remove =
            document.createElement("button");

        remove.className = "delete";
        remove.textContent = "×";

        remove.onclick = () => {

            entries =
                entries.filter(
                    item => item.id !== entry.id
                );

            save();
            render();
        };

        row.append(
            arrival,
            elapsedElement,
            remove
        );

        entriesContainer.appendChild(row);
    });
}


function calculate() {

    const parsed =
        parseTime(input.value);

    if (!parsed) {

        result.style.display = "block";
        resultTime.textContent =
            "Please enter a valid time.";

        return;
    }

    const elapsed =
        calculateElapsed(parsed);

    if (elapsed === null) {

        result.style.display = "block";
        resultTime.textContent =
            "That time has not occurred yet.";

        return;
    }

    result.style.display = "block";

    resultTime.textContent =
        durationText(elapsed);

    entries.unshift({
        id: Date.now(),
        time: parsed.display
    });

    save();
    render();

    input.value = "";
    input.focus();
}


calculateButton.addEventListener(
    "click",
    calculate
);

input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            calculate();
        }
    }
);

clearButton.addEventListener(
    "click",
    () => {

        entries = [];

        save();
        render();

        result.style.display = "none";
    }
);


function update() {
    updateClock();
    render();
}

update();

setInterval(update, 1000);

</script>

</body>
</html>
